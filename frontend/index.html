    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Premium developer portfolio displaying software engineering projects, experience timeline, and interactive console controls." />
    <meta name="theme-color" id="theme-meta" content="#030014" />
    
    <style>
      html, body {
        background-color: #030014;
      }
      [data-theme="light"], [data-theme="light"] body {
        background-color: #f4f6fc;
      }
    </style>
    
    <script>
      (function() {
        try {
          const savedTheme = localStorage.getItem('theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          document.documentElement.setAttribute('data-theme', savedTheme);
          const meta = document.getElementById('theme-meta');
          if (meta) {
            meta.setAttribute('content', savedTheme === 'dark' ? '#030014' : '#f4f6fc');
          }
        } catch(e) {}
      })();
    </script>
    <title>Umar Yahya</title>
